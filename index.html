<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رضا کاظمی | طراح گرافیک</title>
  <style>
    :root { --bg:#0a0a0a; --fg:#f5f5f5; --muted:#888; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; line-height: 1.7; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    header { text-align: center; padding: 4rem 0 2rem; }
    h1 { font-size: 2.5rem; font-weight: 300; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 16px; margin: 2rem 0; }
    .item { background: #111; height: 200px; display: flex; align-items: center; justify-content: center; border: 1px solid #222; }
    footer { text-align: center; padding: 3rem 0; color: var(--muted); }
  </style>
</head>
<body>
<div class="container">
<header>
<h1>رضا کاظمی</h1>
<p>طراح گرافیک و هویت بصری | تهران</p>
</header>
<section>
<h2>کارهای منتخب</h2>
<div class="grid">
  <div class="item">هویت برند کافه</div>
  <div class="item">پوستر نمایشگاه</div>
  <div class="item">واجه وب‌سایت</div>
  <div class="item">پک آیکون</div>
</div>
</section>
<footer>© ۱۴۰۵ رضا کاظمی — Minimal Mono</footer>
</div>
</body>
</html>
